<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadastro de Usuários</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f14;
      --card: #10161d;
      --muted: #8aa0b6;
      --text: #e6eef6;
      --accent: #7dd3fc;
      --fs-base: clamp(1rem, 0.9rem + 0.4vw, 1.125rem);
      --fs-sm: clamp(0.9rem, 0.8rem + 0.25vw, 1rem);
      --fs-lg: clamp(1.125rem, 1rem + 0.6vw, 1.35rem);
      --fs-h1: clamp(2rem, 1.2rem + 5vw, 4rem);
      --fs-h2: clamp(1.4rem, 1.1rem + 2.5vw, 2.2rem);
      --radius: 1.25rem;
      --shadow: 0 10px 30px rgba(0,0,0,.25);
      --header-h: 64px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: var(--header-h); }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      font-size: var(--fs-base);
      color: var(--text);
      background: radial-gradient(1200px 600px at 80% -10%, #13202b 0%, transparent 60%),
                  radial-gradient(1000px 500px at -10% -15%, #11222e 0%, transparent 60%),
                  var(--bg);
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }
    .img-fluid { width: 100%; height: auto; display: block; }

    .header {
      position: fixed; inset: 0 0 auto 0;
      height: var(--header-h);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; backdrop-filter: blur(10px);
      background: rgba(10,15,20,0.55); border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .nav { width: min(1200px, 92vw); display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .brand { font-weight: 800; letter-spacing: .4px; font-size: 1.05rem; }
    .menu { display: flex; gap: 1rem; align-items: center; }
    .menu a { padding: .55rem .8rem; border-radius: .75rem; font-size: var(--fs-sm); color: var(--muted); }
    .menu a:hover { color: var(--text); background: rgba(255,255,255,.06); }
    .cta { padding: .6rem .95rem; border-radius: 999px; background: linear-gradient(135deg, var(--accent), #60a5fa); color: #0a0f14; font-weight: 700; box-shadow: var(--shadow); }

    section { padding: 3rem 0; }
    .container { width: min(1100px, 92vw); margin: 0 auto; }

    .hero { min-height: 100svh; display: grid; place-items: center; text-align: center; padding-top: calc(var(--header-h) + 2rem); }
    .hero h1 { font-size: var(--fs-h1); line-height: 1.05; margin: 0 0 1rem; }
    .hero p { color: var(--muted); font-size: var(--fs-lg); margin: 0 0 2rem; }

    .btn { display: inline-block; padding: .9rem 1.2rem; border-radius: 999px; font-weight: 700; }
    .btn-primary { background: linear-gradient(135deg, var(--accent), #60a5fa); color: #0a0f14; box-shadow: var(--shadow); }
    .btn-ghost { color: var(--text); border: 1px solid rgba(255,255,255,.12); }

    .card { background: var(--card); border-radius: var(--radius); padding: 2rem; box-shadow: var(--shadow); max-width: 500px; margin: 0 auto; }
    input, label { display: block; width: 100%; margin-bottom: 1rem; font-size: var(--fs-sm); }
    input { padding: .65rem; border-radius: .75rem; border: 1px solid rgba(255,255,255,.12); background: #0f161f; color: var(--text); }
    input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(125,211,252,.3); }

    @media (min-width: 768px) { .hero { text-align: left; } .hero .container { display: grid; grid-template-columns: 1.2fr 1fr; align-items: center; gap: 2rem; } }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <nav class="nav">
      <a class="brand" href="#top">suaMarca</a>
      <div class="menu">
        <a href="#hero">Cadastro</a>
      </div>
    </nav>
  </header>

  <!-- Hero / Formulário -->
  <section id="hero" class="hero">
    <div class="container">
      <div>
        <h1>Cadastre-se</h1>
        <p>Preencha os dados abaixo para criar um novo usuário.</p>
        <div class="card">
          <form id="userForm">
            <label for="name">Nome</label>
            <input type="text" id="name" name="name" placeholder="Seu nome" required />
            
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="seu@email.com" required />
            
            <button type="submit" class="btn btn-primary">Cadastrar</button>
          </form>
          <p id="responseMessage" style="margin-top:1rem; color: var(--accent);"></p>
        </div>
      </div>
      <div>
        <img class="img-fluid" src="https://images.unsplash.com/photo-1529336953121-ad5a0d43d0d2?q=80&w=1600&auto=format&fit=crop" alt="Cadastro de usuário" loading="lazy" />
      </div>
    </div>
  </section>

  <footer style="padding:2rem; color: var(--muted); text-align:center;">© <span id="year"></span> Guilherme Carvalho</footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const form = document.getElementById('userForm');
    const responseMessage = document.getElementById('responseMessage');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = form.name.value.trim();
      const email = form.email.value.trim();

      if(!name || !email) return;

      try {
        const res = await fetch('http://localhost:3005/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email })
        });

        const data = await res.json();

        if(res.ok){
          responseMessage.style.color = 'lightgreen';
          responseMessage.textContent = `Usuário ${data.name} cadastrado com sucesso!`;
          form.reset();
        } else {
          responseMessage.style.color = 'orange';
          responseMessage.textContent = data.message || 'Erro ao cadastrar';
        }

      } catch(err){
        responseMessage.style.color = 'red';
        responseMessage.textContent = 'Erro de conexão com o servidor';
      }
    });
  </script>
</body>
</html>
