<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sistema de Usuários</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0b0f14;--card:#10161d;--muted:#8aa0b6;--text:#e6eef6;--accent:#7dd3fc;--shadow:0 10px 30px rgba(0,0,0,.25);--radius:1.25rem;}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:var(--text);}
    h1,h2{margin-top:0}.container{width:min(1100px,90%);margin:2rem auto;}
    .card{background:var(--card);padding:2rem;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:2rem;}
    label,input,select{display:block;width:100%;margin-bottom:.75rem;}
    input,select{padding:.6rem;border-radius:.6rem;border:1px solid rgba(255,255,255,.12);background:#0f161f;color:var(--text);}
    input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(125,211,252,.3);}
    button{cursor:pointer;border:none;border-radius:999px;padding:.6rem 1rem;font-weight:600;}
    .btn-primary{background:linear-gradient(135deg,var(--accent),#60a5fa);color:#0a0f14;box-shadow:var(--shadow);}
    .btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.2);color:var(--text);}
    table{width:100%;border-collapse:collapse;margin-top:1rem;}
    th,td{padding:.75rem;border-bottom:1px solid rgba(255,255,255,.1);text-align:left;}
    tr:hover{background:rgba(255,255,255,.05);}
    .actions button{margin-right:.5rem;}
    .hidden{display:none;}
  </style>
</head>
<body>
  <div class="container">
    <!-- LOGIN -->
    <div id="loginCard" class="card">
      <h1>Login</h1>
      <form id="loginForm">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" required />
        <label for="loginPassword">Senha</label>
        <input type="password" id="loginPassword" required />
        <button type="submit" class="btn-primary">Entrar</button>
      </form>
      <p id="loginMsg"></p>
    </div>

    <!-- CRUD -->
    <div id="crudSection" class="hidden">
      <h1>Gerenciamento de Usuários</h1>
      <button id="logoutBtn" class="btn-ghost" style="float:right">Sair</button>

      <div class="card">
        <h2>Cadastrar Usuário</h2>
        <form id="userForm">
          <label>Email</label>
          <input type="email" id="email" required />
          <label>Senha</label>
          <input type="password" id="password" required />
          <label>Nível de Acesso</label>
          <select id="accessLevel" required>
            <option value="administrativo">Administrativo</option>
            <option value="gerencial">Gerencial</option>
            <option value="visualizacao" selected>Visualização</option>
          </select>
          <button type="submit" class="btn-primary">Cadastrar</button>
        </form>
        <p id="responseMessage"></p>
      </div>

      <div class="card">
        <h2>Usuários</h2>
        <button id="refreshBtn" class="btn-ghost">Atualizar Lista</button>
        <table id="userTable">
          <thead><tr><th>ID</th><th>Email</th><th>Nível</th><th>Ações</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>

      <div id="editCard" class="card hidden">
        <h2>Editar Usuário</h2>
        <form id="editForm">
          <input type="hidden" id="editId" />
          <label>Email</label>
          <input type="email" id="editEmail" required />
          <label>Nova Senha (opcional)</label>
          <input type="password" id="editPassword" />
          <label>Nível de Acesso</label>
          <select id="editAccessLevel" required>
            <option value="administrativo">Administrativo</option>
            <option value="gerencial">Gerencial</option>
            <option value="visualizacao">Visualização</option>
          </select>
          <button type="submit" class="btn-primary">Salvar</button>
          <button type="button" id="cancelEdit" class="btn-ghost">Cancelar</button>
        </form>
        <p id="editMessage"></p>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:3005';
    const token = () => localStorage.getItem('token');

    const loginCard = document.getElementById('loginCard');
    const crudSection = document.getElementById('crudSection');
    const loginForm = document.getElementById('loginForm');
    const loginMsg = document.getElementById('loginMsg');
    const logoutBtn = document.getElementById('logoutBtn');

    // Mostrar CRUD se logado
    if(token()){loginCard.classList.add('hidden');crudSection.classList.remove('hidden');}

    // LOGIN
    loginForm.addEventListener('submit', async e=>{
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      try{
        const res=await fetch(`${API_URL}/login`,{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({email,password})
        });
        const data=await res.json();
        if(res.ok){
          localStorage.setItem('token',data.token);
          loginCard.classList.add('hidden');
          crudSection.classList.remove('hidden');
          loadUsers();
        }else{
          loginMsg.style.color='orange';
          loginMsg.textContent=data.message||'Falha no login';
        }
      }catch(err){loginMsg.style.color='red';loginMsg.textContent='Erro de conexão';}
    });

    logoutBtn.addEventListener('click',()=>{
      localStorage.removeItem('token');
      location.reload();
    });

    // CRUD
    const form = document.getElementById('userForm');
    const responseMessage = document.getElementById('responseMessage');
    const refreshBtn = document.getElementById('refreshBtn');
    const userTableBody = document.querySelector('#userTable tbody');
    const editCard = document.getElementById('editCard');
    const editForm = document.getElementById('editForm');
    const editMessage = document.getElementById('editMessage');
    const cancelEdit = document.getElementById('cancelEdit');

    form.addEventListener('submit',async e=>{
      e.preventDefault();
      const email=document.getElementById('email').value.trim();
      const password=document.getElementById('password').value.trim();
      const accessLevel=document.getElementById('accessLevel').value;
      try{
        const res=await fetch(`${API_URL}/users`,{
          method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token()}`},
          body:JSON.stringify({email,password,accessLevel})
        });
        const data=await res.json();
        if(res.ok){
          responseMessage.style.color='lightgreen';
          responseMessage.textContent=`Usuário ${data.user.email} cadastrado!`;
          form.reset();loadUsers();
        }else{
          responseMessage.style.color='orange';
          responseMessage.textContent=data.message||'Erro';
        }
      }catch(err){responseMessage.style.color='red';responseMessage.textContent='Erro de conexão';}
    });

    async function loadUsers(){
      userTableBody.innerHTML='';
      const res=await fetch(`${API_URL}/users`,{headers:{'Authorization':`Bearer ${token()}`}});
      const users=await res.json();
      users.forEach(u=>{
        const tr=document.createElement('tr');
        tr.innerHTML=`<td>${u.id}</td><td>${u.email}</td><td>${u.accessLevel}</td>
          <td class="actions">
            <button class="btn-ghost" onclick="editUser(${u.id},'${u.email}','${u.accessLevel}')">Editar</button>
            <button class="btn-ghost" onclick="deleteUser(${u.id})">Excluir</button>
          </td>`;
        userTableBody.appendChild(tr);
      });
    }

    window.editUser=(id,email,level)=>{
      editCard.classList.remove('hidden');
      editForm.editId.value=id;
      editForm.editEmail.value=email;
      editForm.editPassword.value='';
      editForm.editAccessLevel.value=level;
      editMessage.textContent='';
      window.scrollTo({top:0,behavior:'smooth'});
    };
    cancelEdit.addEventListener('click',()=>editCard.classList.add('hidden'));

    editForm.addEventListener('submit',async e=>{
      e.preventDefault();
      const id=editForm.editId.value;
      const email=editForm.editEmail.value.trim();
      const password=editForm.editPassword.value.trim();
      const accessLevel=editForm.editAccessLevel.value;
      try{
        const res=await fetch(`${API_URL}/users/${id}`,{
          method:'PUT',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token()}`},
          body:JSON.stringify({email,password:password||undefined,accessLevel})
        });
        const data=await res.json();
        if(res.ok){editMessage.style.color='lightgreen';editMessage.textContent='Usuário atualizado!';loadUsers();setTimeout(()=>editCard.classList.add('hidden'),1000);}
        else{editMessage.style.color='orange';editMessage.textContent=data.message||'Erro';}
      }catch(err){editMessage.style.color='red';editMessage.textContent='Erro de conexão';}
    });

    window.deleteUser=async id=>{
      if(!confirm('Excluir este usuário?'))return;
      const res=await fetch(`${API_URL}/users/${id}`,{method:'DELETE',headers:{'Authorization':`Bearer ${token()}`}});
      const data=await res.json();
      if(res.ok){loadUsers();}else{alert(data.message||'Erro');}
    };

    refreshBtn.addEventListener('click',loadUsers);
  </script>
</body>
</html>
